[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxrate"
version = "0.1.0"
description = "Stochastic MCFGs with phylogenetic terminal weights"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "jax[cpu]>=0.4.20",
    "subby",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
include = ["jaxrate*"]
